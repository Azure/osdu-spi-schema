global:
  domain: ""
  limitsEnabled: true
  dataPartitionId: ""

data:
  #Configmaps
  entitlementsHost: "http://entitlements"
  javaOptions: "-Xms512M -XX:MaxRAMPercentage=70 -XX:+UseG1GC -XX:+UseStringDeduplication -XX:InitiatingHeapOccupancyPercent=45"
  logLevel: "ERROR"
  partitionHost: "http://partition"
  schemaTopicName: "schema-changed"
  schemaChangedMessagingEnabled: true
  enableCleanup: false
  schemaHost: "http://schema"
  #Deployments
  requestsCpu: "220m"
  requestsMemory: "1.7G"
  limitsCpu: "1"
  limitsMemory: "2.5G"
  bootstrapImage: ""
  bootstrapServiceAccountName: ""
  # Authority the bootstrap job registers the shared schemas under (the first part of a schema
  # kind, "osdu" in osdu:wks:...). Only letters, digits, "_" and "-" are allowed.
  schemaAuthority: "osdu"
  # Threads used by the bootstrap job to register independent schemas (1 = sequential, max 8).
  bootstrapWorkers: 4
  # Schema override for the bootstrap job. By default the schemas bundled in the
  # bootstrap image are used. Set schemaPackageVersion ("27.1.0", "27.1" for the newest 27.1.x,
  # or "27" for the newest 27.x.x) to download the schemas of that released version of the
  # bootstrap bundle from the GitLab package registry instead. Keep it in quotes: YAML turns
  # 27.10 into 27.1, and the chart rejects a number.
  schemaPackageVersion: ""
  # Base URL of the generic package registry; empty uses the URL recorded in the image.
  schemaPackageUrl: ""
  # Optional sha256 of the downloaded bundle file, as GitLab shows it in the package's
  # Assets (Deploy > Package registry). The bundle is rejected if it differs.
  schemaPackageSha256: ""
  # Use the bundled schemas if the download fails instead of failing the job.
  schemaPackageFallback: false
  image: ""
  imagePullPolicy: "IfNotPresent"
  serviceAccountName: "schema"

conf:
  appName: "schema"
  bootstrapSecretName: "datafier-secret"
  configmap: "schema-config"
  s3SecretName: "schema-seaweedfs-secret"
  postgresSecretName: "schema-postgres-secret"
  rabbitmqSecretName: "rabbitmq-secret"
  replicas: 1

istio:
  proxyCPU: "90m"
  proxyCPULimit: "500m"
  proxyMemory: "100Mi"
  proxyMemoryLimit: "512Mi"
  bootstrapProxyCPU: "10m"
  bootstrapProxyCPULimit: "100m"
